name: crm_flutter
description: LeadMang CRM Flutter app — leads, quotes, follow-ups, operations.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  url_launcher: ^6.3.2
  google_fonts: ^6.3.2
  flutter_local_notifications: ^22.3.1
  flutter_background_service: ^5.1.0
  permission_handler: ^12.0.1
  socket_io_client: ^3.1.6
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  timezone: ^0.11.1
  pdf: ^3.13.1
  printing: ^5.15.1
  webview_flutter: ^4.14.1
  flutter_native_html_to_pdf: ^3.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/quote_pdf/
    - assets/branding/
